[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "worktheflow"
version = "0.1.0"
description = "wtf - WorkTheFlow: A strict, policy-enforcing workflow engine for AI coding tools"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "jsonschema>=4.26.0",
]

[project.scripts]
wtf = "wtf.cli:app"
wf = "wtf.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/wtf"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
